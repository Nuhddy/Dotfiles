[audio]
enable_sounds = false

[bar.default]
end = [ "tray", "network", "volume", "keyboard_layout", "notifications" ]
margin_ends = 0
radius = 0
shadow = false
start = [ "control-center", "launcher", "workspaces" ]
widget_spacing = 12

[calendar]

[control_center.calendar]
show_events_card = false
show_week_numbers = true

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
address = "Roskilde, Denmark"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 160.0
    box_width = 352.0
    cx = 960.0
    cy = 252.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 32.0
    box_width = 288.0
    cx = 960.0
    cy = 332.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        format = "{:%A, %d %B}"
        shadow = false

[nightlight]
enabled = true

[osd]
offset_x = 8
position = "top_right"

    [osd.kinds]
    media = false

[plugins]
enabled = []

[shell]
date_format = "%A, %d/%m/%Y"
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = false

        [shell.launcher.providers.calculator]
        prefix = ""

        [shell.launcher.providers.session]
        global = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.session]
    show_shortcuts = false

    [shell.window_switcher]
    mru = true

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Mocha Blue"
source = "community"

[wallpaper]
directory = "/home/nuhddy/.config/nixos/assets"

    [wallpaper.default]
    path = "/home/nuhddy/.config/nixos/assets/wallpaper.png"

    [wallpaper.last]
    path = "/home/nuhddy/.config/nixos/assets/wallpaper.png"

[widget.clock]
format = "{:%a, %d %b, %H:%M}"

[widget.control-center]
glyph = "settings-2"

[widget.keyboard_layout]
show_glyph = false

[widget.launcher]
glyph = "terminal-2"

[widget.network]
show_label = false

[widget.tray]
drawer = true
pinned = [ "Vesktop", "steam" ]

[widget.volume]
show_label = false

[widget.workspaces]
label_source = "name"
show_labels = false
